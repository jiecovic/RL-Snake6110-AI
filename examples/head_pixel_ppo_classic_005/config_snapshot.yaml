# Full validated training config.
# Single source of truth for reproducing a run.
run:
  name: head_pixel_ppo_classic
  seed: 42
  num_envs: 64
  vec: rust
  checkpoint:
    freq: 1000000
    eval:
      enabled: true
      episodes: 100
      deterministic: true
      seed_offset: 10000
  total_timesteps: 900000000
board:
  height: 13
  width: 22
  food_count: 1
  spawn_random_dir: true
reward:
  max_steps_factor: 1.3
  win_reward: 25.0
  food_reward: 3.0
  food_speed_bonus: 1.0
  fatal_penalty: 5.0
  step_penalty_scale: 1.0
  timeout_penalty: 0.0
  step_progress_pivot: 0.6
  step_progress_weight: 1.0
env:
  action:
    type: relative
  obs:
    kind: pixel
    view: head
    params:
      view_radius: 10
      rotate_to_head: true
      add_oob_mask: false
    features: {}
  frame_stack:
    n_frames: 1
feature_extractor:
  type: snake_unified
  features_dim: 512
  params:
    stem:
      type: px_cnn
      params:
        d_model: 32
        layers:
        - out: 16
          k: 4
          s: 4
          p: 0
          act: relu
        - out: 32
          k: 3
          s: 1
          p: 0
          act: relu
        - out: 64
          k: 3
          s: 1
          p: 0
          act: relu
        - out: 32
          k: 1
          s: 1
          p: 0
          act: relu
          pool:
            type: avg
            k: 2
            s: 2
            p: 0
        frame_mode: stacked
        frame_base_channels: 1
    mixer:
      type: identity
    pos_mode: none
    pooling: flatten
    use_cls_token: false
    use_frame_embed: false
    flatten_mlp_hidden:
    - 512
    head_layernorm: false
    head_activation: relu
train:
  algo:
    type: ppo
    params:
      policy_kwargs:
        net_arch: []
        activation_fn: relu
      n_steps: 2048
      batch_size: 512
      n_epochs: 5
      gamma: 0.998
      ent_coef: 0.03
      learning_rate: 0.0001
      normalize_advantage: true
      verbose: 0
metrics:
  eval:
    keys:
    - episode/return_mean
    - episode/return_std
    - episode/length_mean
    - episode/length_std
    - episode/score_mean
    - episode/score_min
    - episode/score_max
    - episode/wins
    - episode/win_rate
    - step/return_rate
    - step/score_rate
    termination: true
  train:
    keys:
    - episode/score_mean
    - episode/score_min
    - episode/score_max
    - episode/wins
    - episode/win_rate
    termination: true
