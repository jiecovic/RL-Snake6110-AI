defaults:                               # Hydra defaults: select config groups for this preset.
  - run: default                        # Run config (base values).
  - board: small                        # Board size and food count.
  - reward: default                     # Reward shaping parameters.
  - env: world_pixel                    # Environment + observation spec.
  - feature_extractor: snake_pixel_cnn_world  # Feature extractor architecture.
  - algo: ppo                           # Algorithm config.
  - logging: default                    # Logging config.
  - _self_                              # Include this file's top-level keys.

run:                                    # Override run name for this preset.
  name: world_pixel_ppo                 # Run id (folder name).
