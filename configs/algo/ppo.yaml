algo:                          # Training algorithm configuration.
  type: ppo                    # Algorithm type (currently: ppo).
  params:                      # Algorithm parameters passed to SB3.
    policy_kwargs:             # Policy kwargs passed to SB3.
      net_arch: [256, 256]     # Policy MLP architecture for actor/critic.
    n_steps: 2048              # Number of steps to run for each environment per update.
    batch_size: 256            # Mini-batch size for SGD.
    n_epochs: 2                # Number of epochs per update.
    gamma: 0.995               # Discount factor.
    ent_coef: 0.02             # Entropy coefficient.
    learning_rate: 1e-4        # Learning rate.
    normalize_advantage: true  # Normalize advantage estimates.
    verbose: 0                 # Verbosity level (0 = silent).
eval:                          # Periodic evaluation configuration.
  enabled: true                # Enable eval during training.
  episodes: 20                 # Number of episodes per eval.
  deterministic: true          # Use deterministic policy for eval.
  seed_offset: 10000           # Seed offset added to training seed for eval.
