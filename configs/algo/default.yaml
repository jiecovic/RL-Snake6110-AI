# @package _global_
train:                           # Training algorithm configuration.
  algo:                          # Algorithm config (SB3 PPO).
    type: ppo                    # Algorithm type (currently: ppo).
    params:                      # Algorithm parameters passed to SB3.
      policy_kwargs:             # Policy kwargs passed to SB3.
        net_arch: [512]           # Policy MLP architecture for actor/critic.
        activation_fn: relu       # Activation function: tanh (SB3 default), relu, gelu, elu, leaky_relu, silu, swish.
      n_steps: 2048              # Number of steps to run for each environment per update.
      batch_size: 512            # Mini-batch size for SGD.
      n_epochs: 4                # Number of epochs per update.
      gamma: 0.997               # Discount factor.
      ent_coef: 0.03             # Entropy coefficient.
      learning_rate: 1e-4        # Learning rate.
      normalize_advantage: true  # Normalize advantage estimates.
      verbose: 0                 # Verbosity level (0 = silent).
