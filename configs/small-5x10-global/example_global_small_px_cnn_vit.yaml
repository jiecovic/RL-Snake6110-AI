# configs/example_pov_small_tile_vit.yaml
# PPO on symbolic tile-id grid with ViT-style transformer feature extractor

run:
  name: snake_ppo_vit
  seed: 42
  num_envs: 16
  total_timesteps: 100_000_000
  checkpoint_freq: 250_000
  resume_checkpoint: null

level:
  height: 13
  width: 22
  food_count: 2

env:
  id: global_pixel
  params:
#    tile_vocab: global_no_border_v1
#    remove_border: true

# No frame stacking needed: direction & orientation are encoded in tile IDs
observation:
  frame_stack:
    n_frames: 2


model:
  features_extractor:
    type: px_cnn_vit
    features_dim: 256
    params:
      cnn_stem: px_snake_global
      c_mult: 32
      d_model: 256
      n_layers: 4
      n_heads: 4
      dropout: 0.0
      pooling: mean
      pos_mode : abs_2d
#      flatten_mlp_hidden_dim: 1024
      use_cls_token: false
  net_arch: []


ppo:
  n_steps: 8192
  batch_size: 256
  n_epochs: 3
  gamma: 0.997
  ent_coef: 0.02
  learning_rate: 1e-4

#  gae_lambda: 0.95
#  clip_range: 0.1
#  vf_coef: 0.5
#  max_grad_norm: 0.5
#  target_kl: 0.1
  normalize_advantage: true

  verbose: 0

eval:
  intermediate:
    enabled: true
    episodes: 100
    deterministic: true
    seed_offset: 10_000

  final:
    enabled: true
    episodes: 1000
    deterministic: true
    seed_offset: 20_000
