defaults:                               # Hydra defaults: select config groups.
  - run: default                        # Run config (name, seed, timesteps, etc.).
  - board: default                      # Board size and food count.
  - reward: default                     # Reward shaping parameters.
  - env: default                        # Environment + observation spec.
  - feature_extractor: default          # Feature extractor architecture.
  - algo: default                       # Algorithm config.
  - metrics: default                    # Metrics logging config.
  - logging: default                    # Logging config.
  - _self_                              # Include this file's top-level keys.

hydra:
  run:                                  # Hydra run directory (keep local).
    dir: .
  job:                                  # Do not chdir into run dir.
    chdir: false
  output_subdir: null                   # Disable hydra output subdir.



