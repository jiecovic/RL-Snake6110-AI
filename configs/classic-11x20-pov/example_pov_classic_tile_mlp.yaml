# configs/example_pov_classic_tile_mlp.yaml

run:
  name: snake_11x20_ppo_pov_mlp
  seed: 42
  num_envs: 16
  total_timesteps: 100_000_000
  checkpoint_freq: 250_000
  resume_checkpoint: null

level:
  height: 13
  width: 22
  food_count: 3

env:
  id: pov_tile_id
  params:
    tile_vocab: pov_v1
    view_radius: 10
    rotate_to_head: true

# No frame stacking needed: direction & orientation are encoded in tile IDs
observation:
  frame_stack:
    n_frames: 1

model:
  features_extractor:
    type: tile_mlp
    features_dim: 512
    params:
      d_emb: 8
      mlp_hidden: []
      dropout: 0.0
      pos_mode: abs_2d
      pre_ln: true
  net_arch: [512]


ppo:
  n_steps: 2048
  batch_size: 128
  n_epochs: 2
  gamma: 0.998
  ent_coef: 0.03
  learning_rate: 1e-4

#  gae_lambda: 0.98
#  clip_range: 0.1
#  vf_coef: 0.5
#  max_grad_norm: 0.5
#  target_kl: 0.03
  normalize_advantage: true

  verbose: 0

eval:
  intermediate:
    enabled: true
    episodes: 100
    deterministic: true
    seed_offset: 10_000

  final:
    enabled: true
    episodes: 1000
    deterministic: true
    seed_offset: 20_000
