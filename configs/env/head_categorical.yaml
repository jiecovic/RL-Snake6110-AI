---
action:                   # Action spec (relative or cardinal).
  type: relative          # Action type: relative|cardinal.
obs:                      # Observation spec.
  kind: categorical       # Observation kind: pixel|categorical.
  view: head              # Observation view: head|world.
  params:                 # View-specific parameters.
    tile_vocab: head_v1   # Tile vocab name (categorical view only).
    view_radius: 6        # Head view radius (int or [y, x]).
    rotate_to_head: true  # Rotate head view to face "up".
frame_stack:              # Frame stacking configuration.
  n_frames: 1             # Number of frames to stack.


