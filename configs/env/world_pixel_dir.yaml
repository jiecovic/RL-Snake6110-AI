---
action:                  # Action spec (relative or cardinal).
  type: relative         # Action type: relative|cardinal.
obs:                     # Observation spec.
  kind: pixel            # Observation kind: pixel|categorical.
  view: world            # Observation view: head|world.
  params:                # View-specific parameters.
    remove_border: true  # Remove the border tiles from world view.
  features:              # Optional global features.
    direction: true      # Direction (categorical 0..3).
frame_stack:             # Frame stacking configuration.
  n_frames: 1            # Number of frames to stack.


