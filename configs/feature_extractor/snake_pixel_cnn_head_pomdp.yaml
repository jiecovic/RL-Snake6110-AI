type: snake_unified                                 # Feature extractor type (use snake_unified for modular stems/mixers).
features_dim: 512                                   # Final feature dimension exposed to SB3 policy.
params:                                             # Unified extractor parameters.
  stem:                                             # Token stem (pixel grid -> tokens).
    type: px_cnn                                    # Stem type: px_cnn|cat_identity|cat_patch.
    params:                                         # Stem-specific parameters.
      d_model: 64                                  # Token embedding dimension.
      layers:                                       # CNN layers (list of conv specs).
        - { out: 32, k: 8, s: 4, p: 0, act: relu }  # Each layer: out channels, kernel, stride, padding, activation.
        - { out: 64, k: 4, s: 2, p: 0, act: relu }
        - { out: 64, k: 3, s: 1, p: 0, act: relu }
        - { out: 64, k: 1, s: 1, p: 0, act: relu }
#        - { out: 128, k: 3, s: 1, p: 0, act: relu } # pool : { type: avg, k: 2, s: 2, p: 0} }
#        - { out: 128, k: 2, s: 2, p: 0, act: relu}
#        - { out: 64, k: 3, s: 1, p: 1, act: relu }
#        - { out: 128, k: 3, s: 1, p: 1, act: relu }
      frame_mode: stacked                           # Frame mode: stacked|per_frame.
      frame_base_channels: 1                        # Channels per single frame (used for per_frame).
  mixer:                                            # Mixer (token processing).
    type: identity                                  # Mixer type: identity|transformer.
  pos_mode: none                                    # Positional encoding: abs_2d|none.
  pooling: flatten                                  # Pooling mode: cls|mean|max|cls_mean|meanmax|flatten.
  use_cls_token: false                              # Add CLS token (required for pooling=cls|cls_mean).
  use_frame_embed: false                            # Add frame embedding for stacked frames.
  flatten_mlp_hidden: []                           # Hidden dims for flatten + MLP head (pooling=flatten only).
  head_activation: gelu                             # Head MLP activation: gelu|relu|elu|leaky_relu|silu|swish|tanh.
