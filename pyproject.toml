[build-system]
requires = ["maturin>=1.5"]
build-backend = "maturin"

[project]
name = "snake-rl"
version = "0.1.0"
description = "Snake game with RL runs"
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
    "numpy>=1.23,<2.0",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "torch>=2.0",
    "pygame>=2.5",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    "rich>=13.7",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
# Only needed for your run.py / visualization helpers (opencv, feature maps, etc.)
viz = [
    "opencv-python>=4.8,<5.0",
]
dev = [
    "ruff>=0.6.4",
    "pyright>=1.1.386",
    "maturin>=1.5",
]

[tool.maturin]
python-source = "src"
module-name = "snake_rl._core"
manifest-path = "rust/Cargo.toml"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
snake-play = "snake_rl.cli.play:main"
snake-train = "snake_rl.cli.train:main"
snake-eval = "snake_rl.cli.eval:main"
snake-watch = "snake_rl.cli.watch:main"

# New tools for board and tileset printing
snake-print-board = "snake_rl.tools.print_board:main"
snake-print-tileset = "snake_rl.tools.print_tileset:main"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "assets",
    "configs",
    "demo-videos",
    "experiments",
    "runs",
    "old_*",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "PIE"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pyright]
include = ["src"]
exclude = [
    "assets",
    "configs",
    "demo-videos",
    "experiments",
    "runs",
    "old_*",
    ".venv",
    "venv",
    "env",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
